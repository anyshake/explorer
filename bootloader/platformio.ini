[platformio]
src_dir = ./

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
extra_scripts = pre:pio_link_flags.py
build_flags =
    !python bl_rev.py
    -ffunction-sections
    -fdata-sections
    -Os
    -DSTM32F103xB
    -DUSE_FULL_LL_DRIVER
    -DHSE_VALUE=8000000
    -DHSE_STARTUP_TIMEOUT=100
    -DLSE_STARTUP_TIMEOUT=5000
    -DLSE_VALUE=32768
    -DHSI_VALUE=8000000
    -DLSI_VALUE=40000
    -DVDD_VALUE=3300
    -DPREFETCH_ENABLE=1
    -I./
    -ICore/Inc
    -IUser/Inc
    -IDrivers/CMSIS/Include
    -IDrivers/CMSIS/Device/ST/STM32F1xx/Include
    -IDrivers/STM32F1xx_HAL_Driver/Inc

build_src_filter = +<Core/> +<startup_stm32f103xb.s> +<Drivers/> +<User/>
# STM32F103C8Tx_FLASH.ld is generated by CubeMX (Bootloader.ioc);
# STM32F103C8Tx_FLASH_BOOT.ld is a copy with the bootloader memory layout.
board_build.ldscript = ./STM32F103C8Tx_FLASH_BOOT.ld
board_upload.maximum_size = 4096
board_upload.maximum_ram_size = 20464
upload_protocol = stlink
debug_tool = stlink

upload_flags = -c set CPUTAPID 0
