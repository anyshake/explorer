[platformio]
src_dir = ./
default_envs = genericSTM32F103C8_standalone
; default_envs = genericSTM32F103C8_bootloader

[env]
build_src_filter = +<Core/> +<startup_stm32f103xb.s> +<Drivers/> +<Middlewares/> +<Utils/> +<User/>
debug_tool = stlink
upload_protocol = stlink
upload_flags = -c set CPUTAPID 0

[env:genericSTM32F103C8_standalone]
platform = ststm32
board = genericSTM32F103C8
extra_scripts = pre:pio_link_flags.py
build_flags =
    !python fw_build.py
    !python fw_rev.py
    -ffunction-sections
    -fdata-sections
    -Os
    -Wdouble-promotion
    -Wfloat-conversion
    -DSTM32F103xB
    -ICore/Inc
    -IUser/Inc
    -IUtils/Inc
    -IDrivers/CMSIS/Include
    -IDrivers/CMSIS/Device/ST/STM32F1xx/Include
    -IDrivers/STM32F1xx_HAL_Driver/Inc
    -IDrivers/STM32F1xx_HAL_Driver/Inc/Legacy
    -IMiddlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
    -IMiddlewares/Third_Party/FreeRTOS/Source/include
    -IMiddlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM3
    -DGNSS_MODEL=ALLYSTAR_TAU1114
    -DHARDWARE_REV=20250804
board_build.ldscript = ./STM32F103C8Tx_FLASH.ld

[env:genericSTM32F103C8_bootloader]
extends = env:genericSTM32F103C8_standalone
build_flags =
    -DUSE_BOOTLOADER
    ${env:genericSTM32F103C8_standalone.build_flags}
board_build.ldscript = ./STM32F103C8Tx_FLASH_APP.ld
board_upload.maximum_size = 61440
board_upload.maximum_ram_size = 20464
board_upload.offset_address = 0x08001000
